[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "titre-predictor"
version = "0.1.0"
description = "Final mAb titre prediction for a simulated fed-batch bioprocess"
requires-python = ">=3.11"

# The base dependencies are exactly what is needed to LOAD A FITTED MODEL AND
# PREDICT -- nothing more. Everything used only to *produce* the model lives in
# the `training` extra, and the web stack lives in `service`.
#
# This is not tidiness. The container that serves /predict installs the base set
# plus `service`, so it never carries pandas, scikit-learn or their transitive
# dependencies: 174 MB of packages that inference has no use for. A smaller image
# deploys faster and presents less to keep patched.
#
# The split is verified rather than asserted: importing titre_predictor.model,
# .features, .kinetics and .data.schema pulls in numpy and scipy and nothing else.
# tests/test_dependencies.py enforces that, so an accidental `import pandas` in
# the prediction path fails the build rather than quietly bloating the image.
dependencies = [
    "numpy>=2.0",  # np.trapezoid; np.trapz was removed in 2.0
    "scipy>=1.10", # nnls for the monotone lysate fit; BSpline for its basis
]

[project.optional-dependencies]
# Producing a model: reading the supplied CSVs, screening, and the benchmarks.
training = [
    "pandas>=1.5",       # CSV loading only -- data/loading.py
    "scikit-learn>=1.3", # ElasticNetCV, PLSRegression, permutation importance, PLS, HGBR
]

# Serving one. Kept apart from `training` so the image can install this alone.
service = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn[standard]>=0.27",
]

# Everything, plus the tooling. The self-reference is what keeps `pip install
# -e ".[dev]"` a single command that can run the whole suite.
dev = [
    "titre-predictor[training,service]",
    "pytest>=7.4",
    "ruff>=0.4",
    "mypy>=1.8",
    "httpx>=0.27", # fastapi.testclient.TestClient is built on it
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]

[tool.mypy]
# Deliberately not pinned to a python_version: mypy then checks against the
# interpreter in use. Pinning it to 3.11 makes mypy parse numpy's stubs under 3.11
# rules, and numpy >= 2.5 ships stubs using `type` statements that need 3.12+.
packages = ["titre_predictor"]
mypy_path = "src"
strict = true
# pandas, scipy and scikit-learn ship no py.typed marker; do not fail on their internals.
[[tool.mypy.overrides]]
module = ["pandas.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
